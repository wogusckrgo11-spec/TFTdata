name: Daily MetaTFT Scrape

# 매일 오전 6시 KST (= 전날 21:00 UTC)
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: 스크래퍼 실행
        run: python scraper.py

      - name: 수집 데이터 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "변경 사항 없음, 종료" && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) 수집 결과 (Master+, 17.2)"
          git push
